<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoSync - Timezones But Ugly & Fast</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app-layout">
      <!-- Quirky Brutalist Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <h2>ChronoSync</h2>
        </div>
        
        <nav class="sidebar-nav">
          <a href="#" class="nav-item active" data-target="view-dashboard">
            Dashboard
          </a>
          <a href="#" class="nav-item" data-target="view-settings">
            Settings
          </a>
        </nav>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        
        <!-- Dashboard View -->
        <section id="view-dashboard" class="view-section active">
          <header class="header">
            <div>
              <h1 class="page-title">Global Timeline</h1>
              <p class="page-subtitle">Drag the slider. No math. Just vibes.</p>
            </div>
            
            <div class="header-actions">
              <button class="btn btn-primary open-add-modal">Add Human</button>
              <button class="btn btn-fun" id="btn-chaos">🌀 Time Travel</button>
              <button class="btn btn-secondary share-btn">Copy Link</button>
            </div>
          </header>

          <div class="timeline-container">
            <div class="timeline-header">
              <div class="timeline-status">
                <h2>Master Clock</h2>
              </div>
              <div class="time-display" id="global-time-display">
                12:00
              </div>
            </div>
            
            <div class="slider-wrapper">
              <input type="range" id="global-slider" min="0" max="1439" value="720">
            </div>
          </div>

          <div class="team-grid" id="team-grid">
            <!-- Cards injected by JS -->
          </div>
        </section>

        <!-- Settings View -->
        <section id="view-settings" class="view-section">
          <header class="header">
            <div>
              <h1 class="page-title">Settings</h1>
            </div>
          </header>

          <div class="settings-grid">
            <div class="setting-card">
              <div class="setting-info">
                <h3>24-Hour Time</h3>
                <p>Use military time format (e.g. 14:00 instead of 2:00 PM)</p>
              </div>
              <div class="setting-control">
                <span class="switch-label">Off</span>
                <input type="checkbox" id="setting-24hr">
                <span class="switch-label">On</span>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Add Person Modal -->
    <div class="modal hidden" id="add-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Add Teammate</h3>
          <button class="btn" id="close-modal">X</button>
        </div>
        
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="person-name" placeholder="e.g. Alex" autocomplete="off">
        </div>
        
        <div class="form-group">
          <label>Timezone</label>
          <select id="person-timezone">
            <!-- Populated by JS -->
          </select>
        </div>
        
        <button class="btn btn-primary" style="width:100%" id="save-person-btn">Add to Timeline</button>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast hidden" id="toast">
      Copied to clipboard! 📋
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
